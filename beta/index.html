<style>body{font:17px -apple-system,system-ui,sans-serif;margin:40vh 24px 0;text-align:center;color:#1b2a36;background:#f3f6f5}a{color:#4f6d86}</style>

<p>The beta has finished. Opening the live NutriLedger…</p>
<p><a href="../">Open NutriLedger</a></p>
<script>
// Retire the beta's offline copy so this address never shows an old version, then go to the live app.
(async () => {
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.endsWith('/beta/')) await r.unregister();
  } catch (e) { /* ignore */ }
  location.replace('../');
})();
</script>
</body></html>
