<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183c36"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>NutriLedger</title><style>
*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#f3f7f4;color:#1a3c32;max-width:730px;margin:auto;padding:18px 14px 95px}h1{margin:0;font-size:26px}h2{font-size:19px;margin:0 0 12px}.sub{color:#63786b;font-size:13px}.panel{background:white;border:1px solid #dfe9e1;padding:16px;border-radius:16px;margin:13px 0}.top{display:flex;align-items:center;justify-content:space-between}.nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:15px}.nav button{font-size:12px;flex:1;padding:9px 5px}.on{background:#cde7dc!important}button,input,select{border:1px solid #c9d7ce;border-radius:9px;font:inherit;padding:10px;background:white;color:#193c32;max-width:100%}input,select{width:100%;margin-top:3px}button{cursor:pointer;font-weight:650}button.primary{color:white;background:#186b50;border-color:#186b50}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.metric{font-size:27px;font-weight:800}.track{height:8px;border-radius:20px;background:#e0ece5;overflow:hidden;margin-top:9px}.fill{height:100%;background:#228c65}.item{padding:11px 0;border-bottom:1px solid #e9ede9}.item:last-child{border:0}.hint{font-size:12px;color:#607568;margin-top:5px}#toast{display:none;position:fixed;bottom:10px;left:15px;right:15px;background:#194537;color:white;padding:14px;border-radius:10px;z-index:4}.small{font-size:12px}button.danger{color:#a02d22}.tag{padding:4px 8px;border-radius:20px;background:#e1f3e9;font-size:12px}
</style></head><body><div class="top"><div><h1>NutriLedger</h1><div class="sub">Food, protein and weight diary</div></div><span class="tag" id="currentProfile">MJ</span></div><nav class="nav" id="nav"></nav><main id="main"></main><div id="toast"></div><script>
"use strict";
const KEY="nl_mj_v2";
const initialFoods=[["Chapati",300,10,"piece",35],["Ghee",900,0,"teaspoon",5],["Cooked rice",130,2.7,"small bowl",100],["Dal cooked",115,6.5,"small bowl",120],["Sabzi mixed",85,2,"small bowl",100],["Curd",65,3.7,"small bowl",100],["Roasted chana",380,20,"small bowl",50],["Peanuts",570,25,"small handful",20],["Whey protein",400,80,"scoop",30],["Toned milk",52,3.2,"glass",250],["High-protein Greek yogurt",70,10,"tub",200],["Tofu firm",110,12,"portion",100],["Low-fat paneer",160,20,"portion",100],["Moong sprouts cooked",65,5,"small bowl",100],["Aloo paratha",250,6,"piece",120],["Apple",52,0.3,"piece",180],["Banana",89,1.1,"piece",110],["Orange",47,0.9,"piece",140],["Tea no sugar with milk",25,1,"cup",120],["Rajma cooked",120,7.5,"small bowl",120],["Cucumber",15,0.7,"small bowl",100],["Potato boiled",87,2,"small bowl",100],["Quinoa cooked",120,4.4,"small bowl",100],["Carrot",41,0.9,"small bowl",100],["Makhana",347,9.7,"small bowl",25],["Cashew nuts (kaju)",553,18.2,"small handful",20],["Almonds (badam)",579,21.2,"small handful",20],["Pistachios (pista)",562,20.2,"small handful",20],["Sweet potato",86,1.6,"small bowl",120]];
const seed=()=>({profiles:[{id:"p1",name:"MJ",age:47,sex:"male",height:168,weight:72,calorieGoal:1800,proteinGoal:120}],active:"p1",foods:initialFoods.map((a,i)=>({id:"f"+i,name:a[0],k:a[1],p:a[2],unit:a[3],grams:a[4]})),meals:[],entries:[],weights:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}if(!db.profiles||!db.foods)db=seed();for(const f of seed().foods){if(!db.foods.some(x=>x.name===f.name))db.foods.push(f)}const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};let date=today(),page="Diary",draft=[],editId=null;
const $=id=>document.getElementById(id),p=()=>db.profiles.find(a=>a.id===db.active)||db.profiles[0],round=n=>Math.round((n+Number.EPSILON)*10)/10;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const total=arr=>arr.reduce((t,a)=>({k:t.k+Number(a.k||0),p:t.p+Number(a.p||0)}),{k:0,p:0});
const uid=()=>String(Date.now())+"-"+Math.random().toString(36).slice(2);
const notify=s=>{let x=$("toast");x.textContent=s;x.style.display="block";setTimeout(()=>x.style.display="none",2400)};
const foodOpts=()=>db.foods.map(f=>'<option value="'+escape(f.id)+'">'+escape(f.name)+'</option>').join("");
const mealOpts=v=>["Breakfast","Lunch","Dinner","Snack"].map(a=>'<option '+(a===v?"selected":"")+'>'+a+'</option>').join("");
function entry(name,k,pro,slot){db.entries.push({id:uid(),pid:db.active,date,name,k:round(k),p:round(pro),slot});save();render();notify("Food recorded")}
function render(){let prof=p();$("currentProfile").textContent=prof.name;$("nav").innerHTML=["Diary","Add food","Saved meals","Trends","Profiles","Backup"].map(n=>'<button data-nav="'+n+'" class="'+(page===n?"on":"")+'">'+n+'</button>').join("");$("nav").querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});
let s="";
if(page==="Diary"){let day=db.entries.filter(a=>a.pid===db.active&&a.date===date),t=total(day);s='<section class="panel"><label>Date</label><input id="selectedDate" type="date" value="'+date+'"><div class="row"><div><div class="sub">Calories</div><div class="metric">'+Math.round(t.k)+' <span class="small">/ '+prof.calorieGoal+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,100*t.k/prof.calorieGoal)+'%"></div></div></div><div><div class="sub">Protein</div><div class="metric">'+round(t.p)+'g <span class="small">/ '+prof.proteinGoal+'g</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,100*t.p/prof.proteinGoal)+'%"></div></div></div></div></section><section class="panel"><h2>Food diary</h2>'+day.map(a=>'<div class="item row"><div><b>'+escape(a.name)+'</b><div class="sub">'+escape(a.slot)+' · '+Math.round(a.k)+' kcal · '+a.p+'g protein</div></div><button data-remove="'+a.id+'">Remove</button></div>').join("")+'<div class="hint">Estimates depend on recipes, cooking oil and actual portion sizes.</div></section>'}
if(page==="Add food"){s='<section class="panel"><h2>Add a food</h2><label>Search saved foods</label><input id="filter" placeholder="Chapati, rice, whey…"><label>Food</label><select id="food">'+foodOpts()+'</select><div id="portionHint" class="hint"></div><div class="row"><div><label>Number of portions</label><input id="portions" type="number" min="0.1" step="0.5" value="1"></div><div><label>Grams instead (optional)</label><input id="grams" type="number" min="1" placeholder="Not required"></div></div><label>Meal</label><select id="slot">'+mealOpts("Dinner")+'</select><p><button class="primary" id="addfood">Add to diary</button></p></section><section class="panel"><h2>Search packaged foods online</h2><input id="webfood" placeholder="Search brand or product"><p><button id="websearch">Search database</button></p><div id="webresults"></div><div class="hint">Online product lookup uses Open Food Facts; it does not search every web page. Verify package labels.</div></section><section class="panel"><h2>Create a custom food</h2><label>Name</label><input id="newname" placeholder="Homemade kadhi"><div class="row"><div><label>Calories per 100g</label><input id="newk" type="number"></div><div><label>Protein per 100g</label><input id="newp" type="number"></div></div><div class="row"><div><label>Portion description</label><input id="newunit" value="small bowl"></div><div><label>Grams per portion</label><input id="newgrams" type="number" value="100"></div></div><p><button id="newfood" class="primary">Save food</button></p></section>'}
if(page==="Saved meals"){s='<section class="panel"><h2>Create a combination</h2><label>Meal name</label><input id="title" placeholder="Chana and peanuts bowl"><label>Add food</label><select id="ingredient">'+foodOpts()+'</select><div class="row"><div><label>Portions</label><input id="ingredientQty" type="number" value="1" min=".1" step=".5"></div><div><label>Or grams</label><input id="ingredientGrams" type="number" placeholder="Optional"></div></div><p><button id="addIng">Add ingredient</button></p><div id="draftView"></div><p><button id="saveCombo" class="primary">Save combination</button></p></section><section class="panel"><h2>Your saved combinations</h2>'+db.meals.filter(m=>m.pid===db.active).map(m=>'<div class="item"><b>'+escape(m.name)+'</b><div class="sub">'+m.items.map(i=>escape(i.name)).join(" + ")+'</div><div>'+Math.round(m.k)+' kcal · '+round(m.p)+'g protein</div><div class="row"><input type="number" id="quantity_'+m.id+'" value="1" min=".5" step=".5" aria-label="Servings"><select id="slot_'+m.id+'">'+mealOpts("Dinner")+'</select></div><div class="row"><button class="primary" data-log="'+m.id+'">Log meal</button><button data-edit="'+m.id+'">Edit</button><button data-delete="'+m.id+'">Delete</button></div></div>').join("")+'</section>'}
if(page==="Trends"){let days=[];for(let i=13;i>=0;i--){let d=new Date(date+"T12:00:00");d.setDate(d.getDate()-i);let k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");days.push({date:k,...total(db.entries.filter(a=>a.pid===db.active&&a.date===k))})}let max=Math.max(prof.calorieGoal,...days.map(d=>d.k),1);s='<section class="panel"><h2>14-day calorie trend</h2><svg viewBox="0 0 340 135" role="img" aria-label="Daily calorie chart">'+days.map((d,i)=>{let h=95*d.k/max,x=12+i*23;return '<rect x="'+x+'" y="'+(108-h)+'" width="12" height="'+h+'" fill="#248765" rx="3"/><text x="'+x+'" y="125" font-size="9">'+d.date.slice(8)+'</text>'}).join("")+'</svg><div class="hint">Empty days show as zero; this does not mean you ate zero calories.</div></section><section class="panel"><h2>Track weight</h2><div class="row"><input id="wDate" type="date" value="'+date+'"><input id="wKg" type="number" step=".1" placeholder="Weight kg"></div><p><button id="recordWeight" class="primary">Record weight</button></p>'+db.weights.filter(w=>w.pid===db.active).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(w=>'<div class="item">'+w.date+' · '+w.kg+' kg</div>').join("")+'</section>'}
if(page==="Profiles"){s='<section class="panel"><h2>Profiles</h2><select id="selectedProfile">'+db.profiles.map(q=>'<option value="'+q.id+'" '+(q.id===db.active?"selected":"")+'>'+escape(q.name)+'</option>').join("")+'</select><h2 style="margin-top:20px">Edit selected profile</h2>'+["name","age","sex","height","weight","calorieGoal","proteinGoal"].map(k=>'<label>'+k+'</label><input data-field="'+k+'" value="'+escape(prof[k])+'">').join("")+'<p><button class="primary" id="saveProfile">Save profile</button></p></section><section class="panel"><h2>New profile</h2><input id="profileName" placeholder="Name"><p><button id="createProfile">Create profile</button></p><div class="hint">Goals are editable starting points for adults, not individualized medical guidance.</div></section>'}
if(page==="Backup"){s='<section class="panel"><h2>Export your diary</h2><p>Records are saved only in this browser on this device. They do not synchronize automatically.</p><button class="primary" id="export">Export backup JSON</button><label>Restore from backup</label><input id="restore" type="file" accept=".json,application/json"><p class="hint">Store backups in iCloud Drive. Clearing Safari website data can remove your records.</p></section>'}
$("main").innerHTML=s;wire()}
function wire(){document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{db.entries=db.entries.filter(a=>a.id!==b.dataset.remove);save();render()});if($("selectedDate"))$("selectedDate").onchange=e=>{date=e.target.value;render()};
if(page==="Add food"){let pick=$("food"),hint=()=>{let f=db.foods.find(a=>a.id===pick.value);$("portionHint").textContent=f?("1 "+f.unit+" ≈ "+f.grams+"g · "+Math.round(f.k*f.grams/100)+" kcal · "+round(f.p*f.grams/100)+"g protein"):""};pick.onchange=hint;hint();$("filter").oninput=e=>{pick.innerHTML=db.foods.filter(f=>f.name.toLowerCase().includes(e.target.value.toLowerCase())).map(f=>'<option value="'+escape(f.id)+'">'+escape(f.name)+'</option>').join("");hint()};$("addfood").onclick=()=>{let f=db.foods.find(a=>a.id===pick.value);if(!f)return;let g=Number($("grams").value)||Number($("portions").value)*f.grams;if(g<=0||!Number.isFinite(g))return notify("Invalid quantity");entry(f.name+" ("+Math.round(g)+"g)",f.k*g/100,f.p*g/100,$("slot").value)};$("newfood").onclick=()=>{let name=$("newname").value.trim(),k=Number($("newk").value),pr=Number($("newp").value),g=Number($("newgrams").value);if(!name||!Number.isFinite(k)||k<0||!Number.isFinite(pr)||pr<0||g<=0)return notify("Check quantities");db.foods.push({id:uid(),name,k,p:pr,grams:g,unit:$("newunit").value.trim()||"portion"});save();render();notify("Food saved")};
$("websearch").onclick=async()=>{const q=$("webfood").value.trim();if(!q)return;const results=$("webresults");results.textContent="Searching…";const matches=db.foods.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));const renderLocal=()=>matches.length?'<div class="hint">Already in your food library — use Add food to log these:</div>'+matches.map(f=>'<div class="item"><b>'+escape(f.name)+'</b> · '+Math.round(f.k*f.grams/100)+' kcal per '+escape(f.unit)+'</div>').join(""):"";results.innerHTML=renderLocal();const urls=["https://world.openfoodfacts.org/api/v2/search?search_terms="+encodeURIComponent(q)+"&page_size=8&fields=product_name,brands,nutriments","https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,nutriments"];let products=[],error="";for(const url of urls){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);let response;try{response=await fetch(url,{signal:controller.signal,headers:{"Accept":"application/json"}})}finally{clearTimeout(timer)}if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();products=(data.products||[]).filter(x=>x.product_name&&Number.isFinite(Number(x.nutriments?.["energy-kcal_100g"]))&&Number.isFinite(Number(x.nutriments?.proteins_100g)));if(products.length||Array.isArray(data.products)){error="";break}}catch(e){error=String(e.message||e)}}if(products.length){results.innerHTML=renderLocal()+'<div class="hint">Open Food Facts product results (check labels):</div>'+products.map((x,i)=>'<div class="item"><b>'+escape(x.product_name)+'</b><div class="sub">'+Math.round(x.nutriments["energy-kcal_100g"])+' kcal / 100g · '+x.nutriments.proteins_100g+'g protein</div><button data-saveweb="'+i+'">Save food</button></div>').join("");results.querySelectorAll("[data-saveweb]").forEach(b=>b.onclick=()=>{let x=products[Number(b.dataset.saveweb)];db.foods.push({id:uid(),name:x.product_name,k:Number(x.nutriments["energy-kcal_100g"]),p:Number(x.nutriments.proteins_100g),unit:"100 g",grams:100});save();render();notify("Product saved")})}else{results.innerHTML=renderLocal()+'<div class="hint">'+(error?"Online packaged-food service unavailable ("+escape(error)+"). You can still log saved foods or enter nutrition from a label.":"No suitable packaged products found. For generic foods like kaju, use the built-in library or add manually.")+'</div>'}}}

if(page==="Saved meals"){const show=()=>{$("draftView").innerHTML=draft.map((i,n)=>'<div class="item">'+escape(i.name)+' · '+Math.round(i.k)+' kcal · '+round(i.p)+'g protein <button data-reming="'+n+'">Remove</button></div>').join("");document.querySelectorAll("[data-reming]").forEach(b=>b.onclick=()=>{draft.splice(Number(b.dataset.reming),1);show()})};show();$("addIng").onclick=()=>{let f=db.foods.find(x=>x.id===$("ingredient").value);let g=Number($("ingredientGrams").value)||f.grams*Number($("ingredientQty").value);if(!Number.isFinite(g)||g<=0)return;draft.push({name:f.name+" ("+Math.round(g)+"g)",k:f.k*g/100,p:f.p*g/100});show()};$("saveCombo").onclick=()=>{let name=$("title").value.trim();if(!name||!draft.length)return notify("Name meal and add foods");let t=total(draft),m={id:editId||uid(),pid:db.active,name,items:JSON.parse(JSON.stringify(draft)),k:round(t.k),p:round(t.p)};db.meals=db.meals.filter(x=>x.id!==editId);db.meals.push(m);editId=null;draft=[];save();render();notify("Combination saved")};document.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{let m=db.meals.find(x=>x.id===b.dataset.log),q=Number($("quantity_"+m.id).value);if(q>0)entry(m.name+" × "+q,m.k*q,m.p*q,$("slot_"+m.id).value)});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Delete saved meal?")){db.meals=db.meals.filter(m=>m.id!==b.dataset.delete);save();render()}});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let m=db.meals.find(x=>x.id===b.dataset.edit);editId=m.id;draft=JSON.parse(JSON.stringify(m.items));$("title").value=m.name;show();window.scrollTo(0,0)})}
if(page==="Trends")$("recordWeight").onclick=()=>{let kg=Number($("wKg").value),dt=$("wDate").value;if(!dt||!(kg>0))return;db.weights=db.weights.filter(w=>!(w.pid===db.active&&w.date===dt));db.weights.push({pid:db.active,date:dt,kg});save();render()};
if(page==="Profiles"){$("selectedProfile").onchange=e=>{db.active=e.target.value;save();render()};$("saveProfile").onclick=()=>{let x=p();document.querySelectorAll("[data-field]").forEach(i=>x[i.dataset.field]=["name","sex"].includes(i.dataset.field)?i.value:Number(i.value));save();render();notify("Saved")};$("createProfile").onclick=()=>{let name=$("profileName").value.trim();if(!name)return;let x={...seed().profiles[0],id:uid(),name};db.profiles.push(x);db.active=x.id;save();render()}}
if(page==="Backup"){$("export").onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="NutriLedger-backup-"+date+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$("restore").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.profiles)||!Array.isArray(x.foods)||!Array.isArray(x.entries))throw Error();if(!confirm("Replace existing local data?"))return;db=x;save();render();notify("Restored")}catch{notify("Invalid backup")}}}
}render();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
