$("websearch").onclick=async()=>{const q=$("webfood").value.trim();if(!q)return;const out=$("webresults"),words=q.toLowerCase().split(/\s+/).filter(x=>x.length>1),local=db.foods.filter(f=>words.every(w=>f.name.toLowerCase().includes(w)));const showLocal=()=>local.length?'<p class="hint">Already in your built-in foods:</p>'+local.map(f=>'<div class="item">'+escape(f.name)+' — select this in the food dropdown above.</div>').join(""):"";out.innerHTML=showLocal()+'<p>Searching products…</p>';try{let url="https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=40&fields=product_name,product_name_en,brands,nutriments";let response=await fetch(url);if(!response.ok)throw Error("HTTP "+response.status);let data=await response.json();let items=(data.products||[]).filter(x=>{let name=(x.product_name_en||x.product_name||"").toLowerCase();return words.every(w=>name.includes(w))&&Number.isFinite(Number(x.nutriments?.["energy-kcal_100g"]))&&Number.isFinite(Number(x.nutriments?.proteins_100g))}).slice(0,12);out.innerHTML=showLocal()+(items.length?items.map((x,i)=>'<div class="item"><b>'+escape(x.product_name_en||x.product_name)+'</b><div class="sub">'+escape(x.brands||"")+' · '+Math.round(x.nutriments["energy-kcal_100g"])+' kcal/100g · '+x.nutriments.proteins_100g+'g protein</div><button data-import="'+i+'">Save product</button></div>').join(""):'<p>No matching packaged products. Generic foods such as walnuts belong in the built-in food library.</p>');out.querySelectorAll("[data-import]").forEach(b=>b.onclick=()=>{let x=items[Number(b.dataset.import)],n=x.nutriments;let fields={fat:"fat_100g",carbs:"carbohydrates_100g",fiber:"fiber_100g",sugar:"sugars_100g",satfat:"saturated-fat_100g"};let more={};for(const k in fields){let v=n[fields[k]];if(v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v)))more[k]=Number(v)}if(n.sodium_100g!==null&&n.sodium_100g!==undefined&&Number.isFinite(Number(n.sodium_100g)))more.sodium=Number(n.sodium_100g)*1000;db.foods.push({id:uid(),name:x.product_name_en||x.product_name,k:Number(n["energy-kcal_100g"]),p:Number(n.proteins_100g),unit:"100 g",grams:100,...more});save();render();notify("Product saved")})}catch(e){out.innerHTML=showLocal()+'<p>Online search unavailable. Use saved foods or enter the nutrition label manually.</p>'}}}

if(page==="Saved meals"){const show=()=>{$("draftView").innerHTML=draft.map((i,n)=>'<div class="item">'+escape(i.name)+' · '+Math.round(i.k)+' kcal · '+round(i.p)+'g protein <button data-reming="'+n+'">Remove</button></div>').join("");document.querySelectorAll("[data-reming]").forEach(b=>b.onclick=()=>{draft.splice(Number(b.dataset.reming),1);show()})};show();$("addIng").onclick=()=>{let f=db.foods.find(x=>x.id===$("ingredient").value);let g=Number($("ingredientGrams").value)||f.grams*Number($("ingredientQty").value);if(!Number.isFinite(g)||g<=0)return;draft.push({name:f.name+" ("+Math.round(g)+"g)",k:f.k*g/100,p:f.p*g/100});show()};$("saveCombo").onclick=()=>{let name=$("title").value.trim();if(!name||!draft.length)return notify("Name meal and add foods");let t=total(draft),m={id:editId||uid(),pid:db.active,name,items:JSON.parse(JSON.stringify(draft)),k:round(t.k),p:round(t.p)};db.meals=db.meals.filter(x=>x.id!==editId);db.meals.push(m);editId=null;draft=[];save();render();notify("Combination saved")};document.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{let m=db.meals.find(x=>x.id===b.dataset.log),q=Number($("quantity_"+m.id).value);if(q>0)entry(m.name+" × "+q,m.k*q,m.p*q,$("slot_"+m.id).value)});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Delete saved meal?")){db.meals=db.meals.filter(m=>m.id!==b.dataset.delete);save();render()}});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let m=db.meals.find(x=>x.id===b.dataset.edit);editId=m.id;draft=JSON.parse(JSON.stringify(m.items));$("title").value=m.name;show();window.scrollTo(0,0)})}
if(page==="Insights")$("insightDays").onchange=e=>{sessionStorage.setItem("nl_days",e.target.value);render()};
if(page==="Trends")$("recordWeight").onclick=()=>{let kg=Number($("wKg").value),dt=$("wDate").value;if(!dt||!(kg>0))return;db.weights=db.weights.filter(w=>!(w.pid===db.active&&w.date===dt));db.weights.push({pid:db.active,date:dt,kg});save();render()};
if(page==="Profiles"){$("selectedProfile").onchange=e=>{db.active=e.target.value;save();render()};$("saveProfile").onclick=()=>{let x=p();document.querySelectorAll("[data-field]").forEach(i=>x[i.dataset.field]=["name","sex"].includes(i.dataset.field)?i.value:Number(i.value));save();render();notify("Saved")};$("createProfile").onclick=()=>{let name=$("profileName").value.trim();if(!name)return;let x={...seed().profiles[0],id:uid(),name};db.profiles.push(x);db.active=x.id;save();render()}}
if(page==="Backup"){$("export").onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="NutriLedger-backup-"+date+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$("restore").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.profiles)||!Array.isArray(x.foods)||!Array.isArray(x.entries))throw Error();if(!confirm("Replace existing local data?"))return;db=x;save();render();notify("Restored")}catch{notify("Invalid backup")}}}
}render();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
